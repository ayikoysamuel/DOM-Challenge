<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Challenges</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            margin-right: 10px;
        }
        select {
            margin-bottom: 20px;
        }
        #text__block {
            width: 300px;
            height: 100px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px; /* Default font size */
        }
    </style>
</head>
<body>
    <h1>Change Text, Style & Font-family</h1>
    <label for="font-size">Font Size</label>
        <select name="fonts" id="font-size">
            <option value="20px">20px</option>
            <option value="25px">25px</option>
            <option value="30px">30px</option>
            <option value="35px">35px</option>
        </select>

    <label for="font-color">Font Color</label>
        <select name="colors" id="font-color">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
        </select>

    <label for="font-family">Font Family</label>
        <select name="fonts" id="font-family">
            <option value="Arial">Arial</option>
            <option value="Courier">Courier</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
        </select>

    <div id="text__block">This is My DOM Challenge</div>
    

        <script>
            const textBlock = document.getElementById('text__block');
            const fontSize = document.getElementById('font-size');
            const fontColor = document.getElementById('font-color');
            const fontFamily = document.getElementById('font-family');

            fontColor.addEventListener('change', () => {
                textBlock.style.color = fontColor.value;
            });

            fontSize.addEventListener('change', () => {
                textBlock.style.fontSize = fontSize.value;
            });

            fontFamily.addEventListener('change', () => {
                textBlock.style.fontFamily = fontFamily.value;
            });

        </script>
</body>
</html>
